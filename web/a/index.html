<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="/a/manifest.webmanifest">
  <link rel="icon" href="/a/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/a/icon-192.png">
  <title>VillageLensAI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101418; color: #f5f7fa; }
    main { width: min(100%, 780px); margin: auto; padding: 8px 10px 18px; text-align: center; }
    .controls { position: sticky; top: 0; z-index: 4; padding: 5px 0 4px; background: rgba(16,20,24,.96); }
    .toolbar { display: grid; gap: 5px; margin-bottom: 5px; }
    .touch-toolbar { grid-template-columns: repeat(4, 1fr); }
    .action-toolbar { grid-template-columns: repeat(6, 1fr); }
    button { min-height: 43px; border: 2px solid #52606d; border-radius: 10px; background: #26323b;
      color: white; font-size: 1.3rem; touch-action: manipulation; }
    #camera { background: #9a4f05; border-color: #ffb052; font-size: 1.7rem; }
    button.active { border-color: #fff36a; background: #5b4c08; box-shadow: 0 0 0 3px #fff36a, 0 0 15px #fff36a; }
    button.working { border-color: #62d7ff; background: #174b5f; animation: working 1s infinite alternate; }
    @keyframes working { to { box-shadow: 0 0 15px #62d7ff; } }
    button:focus-visible { outline: 4px solid #65d6ff; outline-offset: 2px; }
    .quality { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 6px; align-items: center; }
    .bar { height: 14px; border: 1px solid #64717d; border-radius: 5px; background: #46515b; }
    #quality-1.ready { background: #e5bc27; border-color: #ffe071; }
    #quality-2.ready { background: #9adfae; } #quality-3.ready { background: #39ad68; }
    .bar.failed { border-color: #9b7048; background: #5c4c3e; }
    #quality-timer { min-width: 2.6em; color: #c7d1da; font-variant-numeric: tabular-nums; font-size: .85rem; }
    #mic-status { margin: 5px 0 0; padding: 7px 9px; border: 2px solid #62d7ff; border-radius: 8px;
      background: #123b4a; color: white; font-size: .9rem; font-weight: 750; }
    #mic-status[data-state="recording"] { border-color: #ff6b6b; background: #5b2020; }
    #mic-status[data-state="blocked"] { border-color: #ffb052; background: #56310e; }
    #mic-status[hidden] { display: none; }
    .gallery { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 4px; margin-top: 7px; }
    .gallery > button { min-height: 42px; padding: 0; }
    #position { color: #c7d1da; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #owner-badge { display: inline-block; margin: 4px 0 0; padding: 3px 10px; border-radius: 999px;
      background: #f5f7fa; color: #101418; border: 2px solid #39ad68; font-size: .9rem; font-weight: 800; }
    #owner-badge[hidden] { display: none; }
    .stage { position: relative; display: none; max-width: 100%; margin: 4px auto 0; background: #222; touch-action: pan-y; }
    .stage.loading #source-image { opacity: .28; }
    #source-image { display: block; max-width: 100%; max-height: 74vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hit { fill: transparent; stroke: none; }
    .underline { stroke: #43caff; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
    .underline.active { stroke: #fff36a; stroke-width: 6; }
    .focus-region { fill: rgba(255,243,106,.22); stroke: #fff36a; stroke-width: 6; vector-effect: non-scaling-stroke; pointer-events: none; }
    .object-region { fill: rgba(98,215,255,.12); stroke: #62d7ff; stroke-width: 4; vector-effect: non-scaling-stroke; cursor: pointer; }
    .object-region.active { fill: rgba(255,243,106,.28); stroke: #fff36a; stroke-width: 7; }
    .transcription-region { fill: rgba(184,140,255,.12); stroke: #b88cff; stroke-width: 4; vector-effect: non-scaling-stroke; cursor: pointer; }
    .playing .underline:not(.active) { opacity: 0; }
    #status, #current { min-height: 1.4em; line-height: 1.25; margin: 4px 0; }
    #current { font-size: clamp(1.3rem, 5vw, 2.35rem); }
    #conversation { margin: 8px 0; text-align: left; }
    #conversation[hidden] { display: none; }
    #conversation h2 { margin: 4px 0 7px; font-size: 1rem; color: #c7d1da; }
    .turn { margin: 7px 0; padding: 8px 10px; border-left: 4px solid #55c98a; border-radius: 6px;
      background: #1b252d; }
    .turn p { margin: 3px 0; line-height: 1.35; }
    .turn .question { color: #b8dff0; }
    .turn .answer { color: white; cursor: pointer; }
    .note { color: #9fb3c8; font-size: .8rem; margin: 6px 0; }
    #install, #ask { background: #176c42; border-color: #55c98a; }
    #ask.active, #ask.working { border-color: #62d7ff; background: #174b5f; }
    #ask.recording { border-color: #ff8a8a; background: #7a2020; animation: working .6s infinite alternate; }
    #install[hidden] { display: none; }
    #camera-guide { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-rows: 1fr auto;
      background: #050708; color: white; }
    #camera-guide[hidden] { display: none; }
    .camera-view { position: relative; min-height: 0; overflow: hidden; }
    #camera-preview { width: 100%; height: 100%; object-fit: cover; background: #000; }
    #camera-frame { position: absolute; inset: 10% 7%; border: 5px solid #ffb052; border-radius: 16px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.2); pointer-events: none; transition: border-color .15s; }
    #camera-guide[data-quality="bad"] #camera-frame { border-color: #ff6868; }
    #camera-guide[data-quality="wait"] #camera-frame { border-color: #ffcf52; }
    #camera-guide[data-quality="ready"] #camera-frame { border-color: #55e58b; box-shadow: 0 0 18px #55e58b,0 0 0 999px rgba(0,0,0,.14); }
    .camera-panel { padding: 10px 12px max(12px,env(safe-area-inset-bottom)); background: rgba(10,14,17,.98); }
    #camera-guidance { min-height: 2.6em; margin: 0 0 8px; font-size: 1.05rem; font-weight: 750; }
    #camera-metrics { margin: 0 0 8px; color: #b8c4ce; font-size: .78rem; font-variant-numeric: tabular-nums; }
    .camera-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 9px; }
    #camera-capture { min-height: 58px; background: #176c42; border-color: #55e58b; font-size: 1.15rem; }
    #camera-cancel { min-height: 58px; }
    @media (hover:hover) { button:hover::after { content: attr(data-tip); position: absolute; transform: translate(-75%, 40px);
      background: #000; padding: 5px 8px; border-radius: 6px; font-size: .75rem; white-space: nowrap; z-index: 10; } }
  </style>
</head>
<body>
  <main>
    <section class="controls" aria-label="Reading controls">
      <nav class="toolbar touch-toolbar" aria-label="Touch reading">
        <button id="mode-word" class="active" aria-label="Touch a word" data-tip="Touch a word">ಅ</button>
        <button id="mode-sentence" aria-label="Touch a sentence" data-tip="Touch a sentence"><small>ಅ ಆ ಇ</small></button>
        <button id="mode-translate" aria-label="Translate English word to Kannada" data-tip="English to Kannada"><small>EN→ಕ</small></button>
        <button id="camera" aria-label="Take a picture" data-tip="Take a picture">📷</button>
      </nav>
      <nav class="toolbar action-toolbar" aria-label="Reading actions">
        <button id="play-words" aria-label="Read words continuously" data-tip="Read words">▶ ಅ</button>
        <button id="play-sentences" aria-label="Read sentences continuously" data-tip="Read sentences"><small>▶ ಅ ಆ ಇ</small></button>
        <button id="select-object" aria-label="Select an object for information" data-tip="Select object">◎</button>
        <button id="infer-global" aria-label="Explain the whole image" data-tip="Explain image">💡</button>
        <button id="ask" aria-label="Ask a spoken question about this image" data-tip="Ask">🎤</button>
        <button id="install" aria-label="Keep VillageLens on this phone" data-tip="Install">📲</button>
      </nav>
      <div class="quality" aria-label="Reading confidence">
        <span class="bar" id="quality-1"></span><span class="bar" id="quality-2"></span>
        <span class="bar" id="quality-3"></span>
        <span id="quality-timer">—</span>
      </div>
      <p id="mic-status" role="status" aria-live="assertive" hidden></p>
    </section>
    <div class="gallery" aria-label="Saved pages">
      <button id="previous" aria-label="Previous page" data-tip="Previous page">‹</button>
      <div id="position" aria-live="polite">Loading I2…</div>
      <button id="next" aria-label="Next page" data-tip="Next page">›</button>
    </div>
    <div id="owner-badge" aria-live="polite" hidden></div>
    <input id="camera-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
    <p id="status" aria-live="polite">ಚಿತ್ರವನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತಿದೆ…</p>
    <div class="stage" id="stage">
      <img id="source-image" alt="Page to read">
      <svg id="overlay" aria-label="Readable words"></svg>
    </div>
    <div id="current" lang="kn"></div>
    <section id="conversation" aria-live="polite" hidden>
      <h2>ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಉತ್ತರಗಳು · Questions and answers</h2>
      <div id="conversation-turns"></div>
    </section>
    <button id="stop" aria-label="Stop reading" data-tip="Stop reading">■</button>
    <p class="note">AI-assisted reading may make mistakes. Swipe the page to see saved tests.</p>
  </main>
  <section id="camera-guide" data-quality="wait" hidden role="dialog" aria-modal="true" aria-label="Guided camera">
    <div class="camera-view">
      <video id="camera-preview" autoplay muted playsinline></video>
      <div id="camera-frame" aria-hidden="true"></div>
    </div>
    <div class="camera-panel">
      <p id="camera-guidance" role="status" aria-live="polite">ಚಿತ್ರ ಅಥವಾ ಪುಟವನ್ನು ಚೌಕದೊಳಗೆ ಇರಿಸಿ · Fit the object or page inside the box</p>
      <p id="camera-metrics" aria-hidden="true">Starting camera…</p>
      <div class="camera-actions">
        <button id="camera-cancel" aria-label="Cancel camera">✕</button>
        <button id="camera-capture" aria-label="Take picture now">📷 ಈಗ ತೆಗೆಯಿರಿ · Take now</button>
      </div>
    </div>
    <canvas id="camera-analysis" width="192" height="144" hidden></canvas>
  </section>
  <script>
    const $ = id => document.getElementById(id);
    const input=$('camera-input'), image=$('source-image'), overlay=$('overlay'), stage=$('stage');
    const status=$('status'), current=$('current'), position=$('position'), timer=$('quality-timer');
    const ownerBadge=$('owner-badge'), micStatus=$('mic-status'), askButton=$('ask');
    const conversation=$('conversation'), conversationTurns=$('conversation-turns');
    const cameraGuide=$('camera-guide'), cameraPreview=$('camera-preview');
    const cameraGuidance=$('camera-guidance'), cameraMetrics=$('camera-metrics'), cameraCanvas=$('camera-analysis');
    let gallery=[], galleryIndex=0, result=null, mode='word', timerId=0, started=0, timerOwner=null;
    let navigationGeneration=0;
    let playbackGeneration=0, speechGeneration=0, pointerStart=null, suppressTap=false, activeControl='mode-word';
    let audioContext=null, activeAudioSource=null, activeRecorder=null, recordingTimer=0, micTimerId=0;
    let cameraStream=null, cameraAnalysisTimer=0, previousCameraFrame=null, cameraReadySince=0;
    let cameraCapturing=false, lastCameraPrompt='', lastCameraPromptAt=0, latestCameraQuality=null;
    const speechAudioCache=new Map();
    const translationCache=new Map();
    const controlIds=['mode-word','mode-sentence','mode-translate','camera','play-words','play-sentences',
      'select-object','infer-global','ask','install'];
    const meaningFields=['summary_kn','brief_spoken_kn','detailed_spoken_kn','scene_type','objects',
      'what_is_it_kn','what_it_does_kn','important_points_kn','action_needed_kn','warning_kn','uncertainty_kn',
      'transcription_kn','spoken_sections','confidence','needs_independent_review'];
    const analysisVersion='context-v2';
    let speechVoices=[];
    const testerId=configureTesterId();

    function refreshSpeechVoices() {
      speechVoices='speechSynthesis' in window?speechSynthesis.getVoices():[];
    }
    function voiceFor(language) {
      const requested=language.toLowerCase(), prefix=requested.split('-')[0];
      return speechVoices.find(voice=>String(voice.lang||'').toLowerCase()===requested)||
        speechVoices.find(voice=>String(voice.lang||'').toLowerCase().split('-')[0]===prefix)||null;
    }
    refreshSpeechVoices();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=refreshSpeechVoices;

    function configureTesterId() {
      const key='villagelens.tester.v1';
      const requested=(new URLSearchParams(location.search).get('tester')||'').toLowerCase();
      if (/^a(?:10|[1-9])$/.test(requested)) {
        try { localStorage.setItem(key,requested); } catch (_) {}
        return requested;
      }
      try { const saved=localStorage.getItem(key)||''; return /^a(?:10|[1-9])$/.test(saved)?saved:''; }
      catch (_) { return ''; }
    }
    function testerHeaders(headers={}) {
      return testerId ? {...headers,'X-VillageLens-Tester-ID':testerId} : headers;
    }

    function captureId() {
      const item=gallery[galleryIndex];
      return item&&/^[0-9a-f]{32}$/.test(item.id)?item.id:'';
    }
    function track(name,ok=true,elapsedMs=0) {
      fetch('/api/events',{method:'POST',headers:testerHeaders({'Content-Type':'application/json'}),
        body:JSON.stringify({events:[{name,capture_id:captureId(),ok,elapsed_ms:elapsedMs}]})}).catch(()=>{});
    }
    function working(id,on) { const node=$(id); node.classList.toggle('working',on); node.setAttribute('aria-busy',String(on)); }
    function showMic(state,message) {
      micStatus.hidden=false; micStatus.dataset.state=state; micStatus.textContent=message;
    }
    function startMicTimer() {
      clearInterval(micTimerId); const began=Date.now();
      const update=()=>showMic('processing',`ಉತ್ತರವನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತಿದೆ… ${Math.floor((Date.now()-began)/1000)}s · Preparing answer…`);
      update(); micTimerId=setInterval(update,1000);
    }
    function stopMicTimer() { clearInterval(micTimerId); micTimerId=0; }
    function renderConversation(item) {
      conversationTurns.textContent=''; const turns=item&&item.conversation||[];
      conversation.hidden=!turns.length;
      for (const [index,turn] of turns.entries()) {
        const node=document.createElement('article'); node.className='turn';
        const question=document.createElement('p'); question.className='question';
        question.textContent=`${index+1}. 🎤 ${turn.question}`;
        const answer=document.createElement('p'); answer.className='answer'; answer.lang='kn';
        answer.textContent=`🔊 ${turn.answer_kn}`; answer.onclick=()=>speak(turn.answer_kn);
        node.append(question,answer); conversationTurns.appendChild(node);
      }
    }
    function restoreQuestionFocus(item) {
      if (item&&item.questionFocus&&item.questionFocus.box) addFocus(item.questionFocus.box);
    }

    function clearControls() {
      for (const id of controlIds) { $(id).classList.remove('active','working'); $(id).setAttribute('aria-busy','false'); }
      activeControl='';
    }
    function setMode(next,id) {
      stop(); mode=next; activeControl=id; $(id).classList.add('active');
      renderContextRegions();
    }
    function startAction(id) {
      if (activeControl===id) { stop(); return false; }
      stop(); mode='none'; activeControl=id; $(id).classList.add('active'); working(id,true); return true;
    }
    function finishAction(id) {
      if (activeControl!==id) return;
      $(id).classList.remove('active'); working(id,false); activeControl='';
    }
    function stop(keepControl=false) {
      playbackGeneration++; speechGeneration++;
      clearTimeout(recordingTimer); recordingTimer=0;
      if (activeRecorder&&activeRecorder.state!=='inactive') { try { activeRecorder.stop(); } catch (_) {} }
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (activeAudioSource) { try { activeAudioSource.stop(); } catch (_) {} activeAudioSource=null; }
      stage.classList.remove('playing');
      document.querySelectorAll('.underline,.object-region').forEach(node => node.classList.remove('active'));
      overlay.querySelectorAll('.focus-region').forEach(node=>node.remove());
      if (!keepControl) { clearControls(); mode='none'; }
      else for (const id of ['play-words','play-sentences','infer-global','ask']) if (id!==activeControl) working(id,false);
    }
    function resetQuality() {
      for (let n=1;n<=3;n++) $('quality-'+n).classList.remove('ready','failed');
      clearInterval(timerId); timerOwner=null; timer.textContent='—';
    }
    function beginTimer(owner,originalStart=Date.now()) {
      timerOwner=owner;
      started=originalStart; clearInterval(timerId); timer.textContent=`${Math.floor((Date.now()-started)/1000)}s`;
      timerId=setInterval(()=>timer.textContent=`${Math.floor((Date.now()-started)/1000)}s`,1000);
    }
    function endTimer(owner) {
      if (timerOwner!==owner) return;
      clearInterval(timerId); timerId=0;
      timer.textContent=`${Math.round((Date.now()-started)/1000)}s ${readCachedStage(owner,3)?'✓':'!'}`;
      timerOwner=null;
    }
    function cacheKey(item,stageNumber) { return `villagelens.reader.v1:${item.id}:${stageNumber}`; }
    function failureKey(item,stageNumber) { return `villagelens.reader.failure.v1:${item.id}:${stageNumber}`; }
    function readCachedStage(item,stageNumber) {
      let value=item[`stage${stageNumber}`]||null;
      try { value=value||JSON.parse(localStorage.getItem(cacheKey(item,stageNumber))||'null'); } catch (_) { value=null; }
      if (stageNumber===3&&value&&value.analysis_version!==analysisVersion) return null;
      return value;
    }
    function saveCachedStage(item,stageNumber,value) {
      item[`stage${stageNumber}`]=value;
      try {
        localStorage.setItem(cacheKey(item,stageNumber),JSON.stringify(value));
        localStorage.removeItem(failureKey(item,stageNumber));
      } catch (_) {}
    }
    function coolingDown(item,stageNumber) {
      try { return Date.now()-Number(localStorage.getItem(failureKey(item,stageNumber))||0)<5*60*1000; }
      catch (_) { return false; }
    }
    function saveFailure(item,stageNumber) {
      try { localStorage.setItem(failureKey(item,stageNumber),String(Date.now())); } catch (_) {}
    }
    function copyMeaning(target,source) {
      if (!target||!source) return;
      for (const key of meaningFields) if (source[key]!==undefined) target[key]=source[key];
      if (source.translations!==undefined) target.translations=source.translations;
    }
    function applyReaderResult(item,stageNumber,value) {
      saveCachedStage(item,stageNumber,value);
      if (stageNumber===2&&item.id!=='demo-i2'&&(value.words||[]).length) {
        item.result=value; copyMeaning(item.result,item);
      }
      if (stageNumber===3) {
        copyMeaning(item,value);
        if (value.scene_type) item.label=String(value.scene_type).slice(0,60);
        if (item.result) copyMeaning(item.result,item);
        if (gallery[galleryIndex]===item&&result) copyMeaning(result,item);
      }
      if (gallery[galleryIndex]===item) {
        const validated=true;
        $('quality-'+stageNumber).classList.toggle('ready',validated);
        $('quality-'+stageNumber).classList.toggle('failed',!validated);
        if (stageNumber===2&&(value.words||[]).length&&item.id!=='demo-i2') {
          render(item.result,false); restoreQuestionFocus(item);
        }
        if (stageNumber===2) track('stage_2',Boolean((value.words||[]).length),value.latency_ms||0);
        if (stageNumber===3&&value.summary_kn) {
          position.textContent=`${item.capture_code?item.capture_code+' · ':''}${item.label}  ${galleryIndex+1}/${gallery.length}`;
          const count=(value.objects||[]).length;
          status.textContent=count?`ಓದುವಿಕೆ, ಅರ್ಥ ಮತ್ತು ${count} ವಸ್ತುಗಳು ಸಿದ್ಧವಾಗಿವೆ.`:'ಓದುವಿಕೆ ಮತ್ತು ಅರ್ಥ ಸಿದ್ಧವಾಗಿದೆ.';
          renderContextRegions(); track('stage_3',value.quality_validated===true,value.latency_ms||0);
        }
      }
    }
    function normalizedSpeech(text) {
      return String(text||'').replace(/\bSmt\.?\s*/gi,'Shrimati ').replace(/\bSri\.?\s*/gi,'Shri ')
        .replace(/\bProf\.?\s*/gi,'Professor ').replace(/\bDr\.?\s*/gi,'Doctor ')
        .replace(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*V\b/gi,'$1 ವೋಲ್ಟ್ ಅಥವಾ $2 ವೋಲ್ಟ್')
        .replace(/(\d+(?:\.\d+)?)\s*(kW|HP|Hz|V|A|W|kg|ml|°C)\b/gi,(_,n,u)=>`${n} ${{kw:'ಕಿಲೋವ್ಯಾಟ್',hp:'ಹಾರ್ಸ್ ಪವರ್',hz:'ಹರ್ಟ್ಸ್',v:'ವೋಲ್ಟ್',a:'ಆಂಪಿಯರ್',w:'ವ್ಯಾಟ್',kg:'ಕಿಲೋಗ್ರಾಂ',ml:'ಮಿಲಿಲಿಟರ್','°c':'ಡಿಗ್ರಿ ಸೆಲ್ಸಿಯಸ್'}[u.toLowerCase()]||u}`)
        .replace(/ಪ್ರೊ\.?/g,'ಪ್ರೊಫೆಸರ್ ').replace(/ಡಾ\.?/g,'ಡಾಕ್ಟರ್ ');
    }
    function speechSegments(text) {
      const chunks=normalizedSpeech(text).match(/[\u0c80-\u0cff]+|[A-Za-z]+|[^A-Za-z\u0c80-\u0cff]+/g)||[];
      const segments=[];
      for (let index=0;index<chunks.length;index++) {
        const chunk=chunks[index];
        let language=/[\u0c80-\u0cff]/.test(chunk)?'kn-IN':(/[A-Za-z]/.test(chunk)?'en-IN':'');
        if (!language) {
          language=segments.length?segments[segments.length-1].language:'';
          if (!language) {
            const next=chunks.slice(index+1).find(value=>/[A-Za-z\u0c80-\u0cff]/.test(value))||'';
            language=/[\u0c80-\u0cff]/.test(next)?'kn-IN':'en-IN';
          }
        }
        if (segments.length&&segments[segments.length-1].language===language) segments[segments.length-1].text+=chunk;
        else segments.push({text:chunk,language});
      }
      return segments.filter(segment=>segment.text.trim());
    }
    async function ensureAudioContext() {
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext=new AudioContextClass();

      if (installPrompt) { await installPrompt.prompt(); installPrompt=null; finishAction('install'); return; }
      const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
      status.textContent=ios?'ಸಫಾರಿಯ Share ⬆️ ಒತ್ತಿ, Add to Home Screen ಆಯ್ಕೆ ಮಾಡಿ.':'Chrome ಮೆನು ⋮ ಒತ್ತಿ, Add to Home screen ಆಯ್ಕೆ ಮಾಡಿ.';
      finishAction('install');
    };
    window.addEventListener('appinstalled',()=>{ $('install').hidden=true; installPrompt=null; });
    window.addEventListener('pagehide',closeGuidedCamera);

    async function loadSharedImage() {
      if (new URLSearchParams(location.search).get('shared')!=='1') return false;
      history.replaceState(null,'',testerId?`/a/?tester=${testerId}`:'/a/');
      try {
        if ('serviceWorker' in navigator) await navigator.serviceWorker.ready;
        const response=await fetch('/a/shared-image',{cache:'no-store'});
        if (!response.ok) throw new Error('SHARED_IMAGE_MISSING');
        const blob=await response.blob();
        await useCapture(new File([blob],'shared-image',{type:blob.type||'image/jpeg'}));
        return true;
      } catch (_) {
        status.textContent='ಹಂಚಿದ ಚಿತ್ರವನ್ನು ತೆರೆಯಲು ಆಗಲಿಲ್ಲ. ಮತ್ತೆ ಹಂಚಿರಿ.';
        return false;
      }
    }
    async function startApp() {
      if ('serviceWorker' in navigator) {
        try { await navigator.serviceWorker.register('/a/sw.js',{scope:'/a/'}); } catch (_) {}
      }
      await loadGallery();
      await loadSharedImage();
    }
    startApp();
  </script>
</body>
</html>
