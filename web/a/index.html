<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101418">
  <title>VillageLensAI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101418; color: #f5f7fa; }
    main { width: min(100%, 780px); margin: auto; padding: 8px 10px 18px; text-align: center; }
    .controls { position: sticky; top: 0; z-index: 4; padding: 5px 0 4px; background: rgba(16,20,24,.96); }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 7px; }
    button { min-height: 48px; border: 2px solid #52606d; border-radius: 12px; background: #26323b;
      color: white; font-size: 1.3rem; touch-action: manipulation; }
    button.active { border-color: #62d7ff; background: #174b5f; }
    button:focus-visible { outline: 4px solid #65d6ff; outline-offset: 2px; }
    .quality { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 6px; align-items: center; }
    .bar { height: 14px; border: 1px solid #64717d; border-radius: 5px; background: #46515b; }
    #quality-1.ready { background: #e5bc27; border-color: #ffe071; }
    #quality-2.ready { background: #9adfae; } #quality-3.ready { background: #39ad68; }
    #quality-4.ready { background: #087238; box-shadow: 0 0 7px #3fbd70; }
    .bar.failed { border-color: #9b7048; background: #5c4c3e; }
    #quality-timer { min-width: 2.6em; color: #c7d1da; font-variant-numeric: tabular-nums; font-size: .85rem; }
    .gallery { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 4px; margin-top: 7px; }
    .gallery > button { min-height: 42px; padding: 0; }
    #position { color: #c7d1da; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage { position: relative; display: none; max-width: 100%; margin: 4px auto 0; background: #222; touch-action: pan-y; }
    .stage.loading #source-image { opacity: .28; }
    #source-image { display: block; max-width: 100%; max-height: 67vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hit { fill: transparent; stroke: none; }
    .underline { stroke: #43caff; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
    .underline.active { stroke: #fff36a; stroke-width: 6; }
    .playing .underline:not(.active) { opacity: 0; }
    #status, #current { min-height: 1.7em; line-height: 1.4; margin: 7px 0; }
    #current { font-size: clamp(1.3rem, 5vw, 2.35rem); }
    .note { color: #9fb3c8; font-size: .8rem; margin: 6px 0; }
    @media (hover:hover) { button:hover::after { content: attr(data-tip); position: absolute; transform: translate(-75%, 40px);
      background: #000; padding: 5px 8px; border-radius: 6px; font-size: .75rem; white-space: nowrap; z-index: 10; } }
  </style>
</head>
<body>
  <main>
    <section class="controls" aria-label="Reading controls">
      <nav class="toolbar" aria-label="Touch reading">
        <button id="mode-word" class="active" aria-label="Touch a word" data-tip="Touch a word">ಅ</button>
        <button id="mode-sentence" aria-label="Touch a sentence" data-tip="Touch a sentence"><small>ಅ ಆ ಇ</small></button>
        <button id="mode-meaning" aria-label="Touch for meaning" data-tip="Meaning">💡</button>
        <button id="camera" aria-label="Take a picture" data-tip="Take a picture">📷</button>
      </nav>
      <nav class="toolbar" aria-label="Continuous reading">
        <button id="play-words" aria-label="Read words continuously" data-tip="Read words">▶ ಅ</button>
        <button id="play-sentences" aria-label="Read sentences continuously" data-tip="Read sentences"><small>▶ ಅ ಆ ಇ</small></button>
        <button id="play-meanings" aria-label="Explain sentences continuously" data-tip="Explain sentences">▶️ 💡</button>
        <button id="play-whole" aria-label="Explain the whole page" data-tip="Explain whole page">📖 💡</button>
      </nav>
      <div class="quality" aria-label="Reading confidence">
        <span class="bar" id="quality-1"></span><span class="bar" id="quality-2"></span>
        <span class="bar" id="quality-3"></span><span class="bar" id="quality-4"></span>
        <span id="quality-timer">—</span>
      </div>
    </section>
    <div class="gallery" aria-label="Saved pages">
      <button id="previous" aria-label="Previous page" data-tip="Previous page">‹</button>
      <div id="position" aria-live="polite">Loading I2…</div>
      <button id="next" aria-label="Next page" data-tip="Next page">›</button>
    </div>
    <input id="camera-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
    <p id="status" aria-live="polite">ಚಿತ್ರವನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತಿದೆ…</p>
    <div class="stage" id="stage">
      <img id="source-image" alt="Page to read">
      <svg id="overlay" aria-label="Readable words"></svg>
    </div>
    <div id="current" lang="kn"></div>
    <button id="stop" aria-label="Stop reading" data-tip="Stop reading">■</button>
    <p class="note">AI-assisted reading may make mistakes. Swipe the page to see saved tests.</p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const input=$('camera-input'), image=$('source-image'), overlay=$('overlay'), stage=$('stage');
    const status=$('status'), current=$('current'), position=$('position'), timer=$('quality-timer');
    let gallery=[], galleryIndex=0, result=null, mode='word', timerId=0, started=0, timerOwner=null;
    let navigationGeneration=0;
    let playbackGeneration=0, speechGeneration=0, pointerStart=null, suppressTap=false;
    let audioContext=null, activeAudioSource=null;
    const speechAudioCache=new Map();
    let speechVoices=[];
    const testerId=configureTesterId();

    function refreshSpeechVoices() {
      speechVoices='speechSynthesis' in window?speechSynthesis.getVoices():[];
    }
    function voiceFor(language) {
      const requested=language.toLowerCase(), prefix=requested.split('-')[0];
      return speechVoices.find(voice=>String(voice.lang||'').toLowerCase()===requested)||
        speechVoices.find(voice=>String(voice.lang||'').toLowerCase().split('-')[0]===prefix)||null;
    }
    refreshSpeechVoices();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=refreshSpeechVoices;

    function configureTesterId() {
      const key='villagelens.tester.v1';
      const requested=(new URLSearchParams(location.search).get('tester')||'').toLowerCase();
      if (/^a(?:10|[1-9])$/.test(requested)) {
        try { localStorage.setItem(key,requested); } catch (_) {}
        return requested;
      }
      try { const saved=localStorage.getItem(key)||''; return /^a(?:10|[1-9])$/.test(saved)?saved:''; }
      catch (_) { return ''; }
    }
    function testerHeaders(headers={}) {
      return testerId ? {...headers,'X-VillageLens-Tester-ID':testerId} : headers;
    }

    function setMode(next) {
      mode=next;
      ['word','sentence','meaning'].forEach(name => $('mode-'+name).classList.toggle('active', name===mode));
    }
    function stop() {
      playbackGeneration++; speechGeneration++;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (activeAudioSource) { try { activeAudioSource.stop(); } catch (_) {} activeAudioSource=null; }
      stage.classList.remove('playing');
      document.querySelectorAll('.underline').forEach(node => node.classList.remove('active'));
    }
    function resetQuality() {
      for (let n=1;n<=4;n++) $('quality-'+n).classList.remove('ready','failed');
      clearInterval(timerId); timerOwner=null; timer.textContent='—';
    }
    function beginTimer(owner,originalStart=Date.now()) {
      timerOwner=owner;
      started=originalStart; clearInterval(timerId); timer.textContent=`${Math.floor((Date.now()-started)/1000)}s`;
      timerId=setInterval(()=>timer.textContent=`${Math.floor((Date.now()-started)/1000)}s`,1000);
    }
    function endTimer(owner) {
      if (timerOwner!==owner) return;
      clearInterval(timerId); timerId=0; timer.textContent=`${Math.round((Date.now()-started)/1000)}s`; timerOwner=null;
    }
    function cacheKey(item,stageNumber) { return `villagelens.reader.v1:${item.id}:${stageNumber}`; }
    function failureKey(item,stageNumber) { return `villagelens.reader.failure.v1:${item.id}:${stageNumber}`; }
    function readCachedStage(item,stageNumber) {
      if (item[`stage${stageNumber}`]) return item[`stage${stageNumber}`];
      try { return JSON.parse(localStorage.getItem(cacheKey(item,stageNumber))||'null'); } catch (_) { return null; }
    }
    function saveCachedStage(item,stageNumber,value) {
      item[`stage${stageNumber}`]=value;
      try {
        localStorage.setItem(cacheKey(item,stageNumber),JSON.stringify(value));
        localStorage.removeItem(failureKey(item,stageNumber));
      } catch (_) {}
    }
    function coolingDown(item,stageNumber) {
      try { return Date.now()-Number(localStorage.getItem(failureKey(item,stageNumber))||0)<5*60*1000; }
      catch (_) { return false; }
    }
    function saveFailure(item,stageNumber) {
      try { localStorage.setItem(failureKey(item,stageNumber),String(Date.now())); } catch (_) {}
    }
    function applyReaderResult(item,stageNumber,value) {
      saveCachedStage(item,stageNumber,value);
      if (stageNumber===2&&item.id!=='demo-i2'&&(value.words||[]).length) {
        item.result=value; if (item.summary_kn) item.result.summary_kn=item.summary_kn;
      }
      if (stageNumber===3) {
        item.summary_kn=value.summary_kn||''; item.translations=value.translations||[];
        if (item.result) { item.result.summary_kn=item.summary_kn; item.result.translations=item.translations; }
      }
      if (gallery[galleryIndex]===item) {
        $('quality-'+stageNumber).classList.add('ready');
        if (stageNumber===2&&(value.words||[]).length&&item.id!=='demo-i2') render(item.result,false);
        if (stageNumber===3&&value.summary_kn) status.textContent='ಓದುವಿಕೆ ಮತ್ತು ಅರ್ಥ ಸಿದ್ಧವಾಗಿದೆ.';
      }
    }
    function normalizedSpeech(text) {
      return String(text||'').replace(/\bSmt\.?\s*/gi,'Shrimati ').replace(/\bSri\.?\s*/gi,'Shri ')
        .replace(/\bProf\.?\s*/gi,'Professor ').replace(/\bDr\.?\s*/gi,'Doctor ')
        .replace(/ಪ್ರೊ\.?/g,'ಪ್ರೊಫೆಸರ್ ').replace(/ಡಾ\.?/g,'ಡಾಕ್ಟರ್ ');
    }
    function speechSegments(text) {
      const chunks=normalizedSpeech(text).match(/[\u0c80-\u0cff]+|[A-Za-z]+|[^A-Za-z\u0c80-\u0cff]+/g)||[];
      const segments=[];
      for (let index=0;index<chunks.length;index++) {
        const chunk=chunks[index];
        let language=/[\u0c80-\u0cff]/.test(chunk)?'kn-IN':(/[A-Za-z]/.test(chunk)?'en-IN':'');
        if (!language) {
          language=segments.length?segments[segments.length-1].language:'';
          if (!language) {
            const next=chunks.slice(index+1).find(value=>/[A-Za-z\u0c80-\u0cff]/.test(value))||'';
            language=/[\u0c80-\u0cff]/.test(next)?'kn-IN':'en-IN';
          }
        }
        if (segments.length&&segments[segments.length-1].language===language) segments[segments.length-1].text+=chunk;
        else segments.push({text:chunk,language});
      }
      return segments.filter(segment=>segment.text.trim());
    }
    async function ensureAudioContext() {
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext=new AudioContextClass();
      if (audioContext.state==='suspended') await audioContext.resume();
      return audioContext;
    }
    function showKannadaVoiceError() {
      status.textContent='ಕನ್ನಡ ಧ್ವನಿ ತಾತ್ಕಾಲಿಕವಾಗಿ ಲಭ್ಯವಿಲ್ಲ. ಮತ್ತೆ ಸ್ಪರ್ಶಿಸಿ.';
    }
    async function playKannada(text,generation) {
      try {
        const context=await ensureAudioContext();
        if (!context||generation!==speechGeneration) return false;
        let buffer=speechAudioCache.get(text);
        if (!buffer) {
          const response=await fetch('/api/speech',{method:'POST',headers:testerHeaders({'Content-Type':'application/json'}),body:JSON.stringify({text})});
          if (response.status===401) { location.href='/access'; return false; }
          if (!response.ok) throw new Error('SPEECH_FAILED');
          buffer=await context.decodeAudioData(await response.arrayBuffer());
          speechAudioCache.set(text,buffer);
        }
        if (generation!==speechGeneration) return false;
        return await new Promise(resolve=>{
          const source=context.createBufferSource(); activeAudioSource=source;
          source.buffer=buffer; source.connect(context.destination);
          source.onended=()=>{ if (activeAudioSource===source) activeAudioSource=null; resolve(generation===speechGeneration); };
          source.start();
        });
      } catch (_) { if (generation===speechGeneration) showKannadaVoiceError(); return false; }
    }
    async function speak(text) {
      stopSpeechOnly();
      if (!text) return false;
      const generation=speechGeneration;
      for (const segment of speechSegments(text)) {
        if (segment.language==='kn-IN') {
          if (!await playKannada(segment.text,generation)) return false;
          continue;
        }
        if (!('speechSynthesis' in window)) return false;
        const selectedVoice=voiceFor(segment.language);
        const completed=await new Promise(resolve => {
          const utterance=new SpeechSynthesisUtterance(segment.text);
          utterance.lang=segment.language; utterance.rate=.7;
          if (selectedVoice) utterance.voice=selectedVoice;
          utterance.onend=()=>resolve({ok:generation===speechGeneration,error:''});
          utterance.onerror=event=>resolve({ok:false,error:event.error||'speech-error'});
          speechSynthesis.speak(utterance);
        });
        if (!completed.ok||generation!==speechGeneration) {
          return false;
        }
      }
      return true;
    }
    function stopSpeechOnly() {
      speechGeneration++;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (activeAudioSource) { try { activeAudioSource.stop(); } catch (_) {} activeAudioSource=null; }
    }
    function lineForWord(word) { return (result.lines||[]).find(line=>line.id===word.line_id); }
    function activate(id,text) {
      document.querySelectorAll('.underline').forEach(node=>node.classList.toggle('active',node.dataset.id===id));
      current.textContent=text||'';
    }
    function explainMeaning() {
      stop(); const meaning=result&&result.summary_kn;
      if (meaning) { current.textContent=meaning; status.textContent='ಪುಟದ ಅರ್ಥ'; speak(meaning); return; }
      current.textContent='Meaning is still being prepared.'; status.textContent='ಅರ್ಥ ಇನ್ನೂ ಸಿದ್ಧವಾಗಿಲ್ಲ.';
    }
    function translatedWord(word) {
      if (!word||!/[A-Za-z]/.test(word.text||'')) return '';
      const normalized=String(word.text).toLocaleLowerCase('en-IN').replace(/[^a-z0-9]+/g,'');
      const match=(result&&result.translations||[]).find(candidate=>
        String(candidate.source||'').toLocaleLowerCase('en-IN').replace(/[^a-z0-9]+/g,'')===normalized);
      return match&&match.translation_kn||'';
    }
    async function selectWord(word) {
      if (mode==='meaning') {
        const translation=translatedWord(word);
        if (translation) { stop(); activate(word.id,translation); status.textContent='ಪದದ ಕನ್ನಡ ಅರ್ಥ'; await speak(translation); return; }
        return explainMeaning();
      }
      const target=mode==='sentence' ? lineForWord(word) : word;
      if (!target) return; activate(target.id,target.text); await speak(target.text);
    }
    function addUnderline(target,box) {
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      const y=box.y+box.height+Math.max(2,Math.round(box.height*.05));
      line.setAttribute('x1',box.x); line.setAttribute('x2',box.x+box.width); line.setAttribute('y1',y); line.setAttribute('y2',y);
      line.setAttribute('class','underline'); line.dataset.id=target.id; overlay.appendChild(line);
    }
    function render(value,markStageOne=true) {
      result=value; overlay.textContent=''; current.textContent='';
      overlay.setAttribute('viewBox',`0 0 ${value.image_size.width} ${value.image_size.height}`);
      for (const word of value.words||[]) {
        const hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
        for (const key of ['x','y','width','height']) hit.setAttribute(key,word.box[key]);
        hit.setAttribute('class','hit'); hit.dataset.id=word.id;
        hit.addEventListener('click',()=>{ if (!suppressTap) selectWord(word); }); overlay.appendChild(hit);
        addUnderline(word,word.box);
      }
      if (markStageOne) $('quality-1').classList.add('ready');
      status.textContent=(value.words||[]).length?'ಪದ ಅಥವಾ ಸಾಲನ್ನು ಸ್ಪರ್ಶಿಸಿ.':'ಪಠ್ಯ ಸಿಗಲಿಲ್ಲ. ಮತ್ತೊಂದು ಚಿತ್ರ ಪ್ರಯತ್ನಿಸಿ.';
    }
    function sceneToResult(scene) {
      if (scene.schema==='smart-glasses.word-annotation.v1') {
        const words=(scene.words||[]).map(word=>{
          const xs=word.polygon.map(point=>point[0]),ys=word.polygon.map(point=>point[1]);
          return {id:word.word_id,line_id:`gold-line-${word.line}`,text:word.text,
            box:{x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys)}};
        });
        const lines=[];
        for (const word of words) {
          let line=lines.find(item=>item.id===word.line_id);
          if (!line) { line={id:word.line_id,text:'',word_ids:[],box:{...word.box}}; lines.push(line); }
          line.text=(line.text+' '+word.text).trim(); line.word_ids.push(word.id);
          const right=Math.max(line.box.x+line.box.width,word.box.x+word.box.width);
          const bottom=Math.max(line.box.y+line.box.height,word.box.y+word.box.height);
          line.box.x=Math.min(line.box.x,word.box.x); line.box.y=Math.min(line.box.y,word.box.y);
          line.box.width=right-line.box.x; line.box.height=bottom-line.box.y;
        }
        return {schema:'villagelens.capture.v1',image_size:{width:scene.reference.width,height:scene.reference.height},words,lines,retained:true};
      }
      const objects=scene.objects||[], lines=objects.filter(o=>o.kind==='line_or_sentence_candidate').map(o=>({
        id:o.object_id, box:o.box, text:(o.recognition||{}).text_candidate||'', word_ids:[],
      }));
      const words=objects.filter(o=>o.kind==='word').map(o=>({
        id:o.object_id, line_id:o.parent_id, box:o.box, text:(o.recognition||{}).text_candidate||'',
      }));
      for (const word of words) { const line=lines.find(item=>item.id===word.line_id); if (line) line.word_ids.push(word.id); }
      return {schema:'villagelens.capture.v1',image_size:scene.image_size,words,lines,retained:true};
    }
    async function loadItem(item) {
      if (item.result) return item.result;
      if (!item.cached) {
        const response=await fetch(item.result_url); if (response.status===401) location.href='/access';
        if (!response.ok) throw new Error('RESULT_FAILED');
        const value=await response.json(); item.cached=item.kind==='demo'?sceneToResult(value):value;
      }
      return item.cached;
    }
    async function showGallery(index) {
      if (!gallery.length) return;
      stop(); const navigation=++navigationGeneration;
      galleryIndex=(index+gallery.length)%gallery.length; const item=gallery[galleryIndex];
      position.textContent=`${testerId?testerId.toUpperCase()+' · ':''}${item.label}  ${galleryIndex+1}/${gallery.length}`; status.textContent='ಚಿತ್ರವನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತಿದೆ…';
      current.textContent=''; overlay.textContent=''; stage.style.display='inline-block'; stage.classList.add('loading'); resetQuality();
      image.onload=()=>{ if (navigation===navigationGeneration) stage.classList.remove('loading'); };
      image.onerror=()=>{ if (navigation===navigationGeneration) status.textContent='ಚಿತ್ರವನ್ನು ತೆರೆಯಲು ಆಗಲಿಲ್ಲ.'; };
      image.src=item.image_url;
      try {
        const loaded=await loadItem(item); if (navigation!==navigationGeneration) return;
        render(loaded);
        for (const stageNumber of [2,3]) {
          const cached=readCachedStage(item,stageNumber);
          if (cached) applyReaderResult(item,stageNumber,cached);
        }
        timer.textContent=[2,3].some(stageNumber=>readCachedStage(item,stageNumber))?'saved':'local';
      }
      catch (_) { if (navigation===navigationGeneration) status.textContent='ಈ ಉಳಿಸಿದ ಚಿತ್ರವನ್ನು ಓದಲು ಆಗಲಿಲ್ಲ.'; }
    }
    async function loadGallery() {
      try {
        const response=await fetch('/api/gallery',{headers:testerHeaders()}); if (response.status===401) return location.href='/access';
        if (!response.ok) throw new Error('GALLERY_FAILED'); gallery=(await response.json()).items||[]; await showGallery(0);
      } catch (_) { status.textContent='ಉಳಿಸಿದ ಚಿತ್ರಗಳನ್ನು ತೆರೆಯಲು ಆಗಲಿಲ್ಲ.'; }
    }
    async function play(items) {
      stop(); const generation=playbackGeneration; stage.classList.add('playing');
      for (const item of items) {
        if (generation!==playbackGeneration) break; activate(item.id,item.text);
        if (!await speak(item.text) || generation!==playbackGeneration) break;
      }
      if (generation===playbackGeneration) { stage.classList.remove('playing'); document.querySelectorAll('.underline').forEach(n=>n.classList.remove('active')); }
    }
    function newCaptureId() {
      return (crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`).replace(/-/g,'').replace(/[^0-9a-f]/gi,'').padEnd(32,'0').slice(0,32).toLowerCase();
    }
    async function callReader(stageNumber,blob,captureId,item) {
      try {
        const response=await fetch(`/api/read/${stageNumber}`,{method:'POST',headers:testerHeaders({'Content-Type':blob.type||'image/jpeg','X-VillageLens-Capture-ID':captureId}),body:blob});
        if (response.status===401) return location.href='/access';
        const value=await response.json(); if (!response.ok) throw new Error(value.error||'READER_FAILED');
        applyReaderResult(item,stageNumber,value);
        return {ok:true};
      } catch (error) { saveFailure(item,stageNumber); return {ok:false,error:error.message||'READER_FAILED'}; }
    }
    async function startCloudReaders(item,blob) {
      const missing=[2,3].filter(stageNumber=>!readCachedStage(item,stageNumber));
      const cooling=missing.filter(stageNumber=>coolingDown(item,stageNumber));
      cooling.forEach(stageNumber=>$('quality-'+stageNumber).classList.add('failed'));
      const requested=missing.filter(stageNumber=>!cooling.includes(stageNumber));
      if (!missing.length) { endTimer(item); timer.textContent='saved'; return; }
      if (!requested.length) { endTimer(item); status.textContent='ಮೊದಲ ಓದುವಿಕೆ ಸಿದ್ಧವಾಗಿದೆ. Cloud reading is cooling down.'; return; }
      if (item.cloudPromise) { beginTimer(item,item.cloudStartedAt); await item.cloudPromise; return; }
      item.cloudStartedAt=item.startedAt||Date.now(); beginTimer(item,item.cloudStartedAt);
      item.cloudPromise=(async()=>{
      try {
        if (!blob) { const response=await fetch(item.image_url); if (!response.ok) throw new Error('IMAGE_FAILED'); blob=await response.blob(); }
        const captureId=/^[0-9a-f]{32}$/.test(item.id)?item.id:'';
        const outcomes=await Promise.all(requested.map(stageNumber=>callReader(stageNumber,blob,captureId,item)));
        if (gallery[galleryIndex]===item) {
          outcomes.forEach((outcome,index)=>{ if (!outcome.ok) $('quality-'+requested[index]).classList.add('failed'); });
          const ready=[2,3].filter(stageNumber=>readCachedStage(item,stageNumber)).length;
          status.textContent=ready ? `${1+ready}/4 reading stages ready.` : 'ಮೊದಲ ಓದುವಿಕೆ ಸಿದ್ಧವಾಗಿದೆ. Cloud reading is busy; try again later.';
        }
      } catch (_) {
        if (gallery[galleryIndex]===item) status.textContent='ಮೊದಲ ಓದುವಿಕೆ ಸಿದ್ಧವಾಗಿದೆ. Slow connection; cloud reading was not completed.';
      } finally { endTimer(item); }
      })();
      await item.cloudPromise;
    }
    async function useCapture(file) {
      if (!file) return; stop(); const navigation=++navigationGeneration; resetQuality(); status.textContent='ಚಿತ್ರವನ್ನು ಓದುತ್ತಿದೆ…';
      const captureId=newCaptureId();
      const objectUrl=URL.createObjectURL(file); image.src=objectUrl; stage.style.display='inline-block';
      const item={id:captureId,label:'Captured page',kind:'capture',image_url:objectUrl,result:null,startedAt:Date.now()};
      beginTimer(item,item.startedAt);
      gallery.splice(Math.min(2,gallery.length),0,item); galleryIndex=gallery.indexOf(item); position.textContent=`${testerId?testerId.toUpperCase()+' · ':''}Captured page  ${galleryIndex+1}/${gallery.length}`;
      try {
        const response=await fetch('/api/capture',{method:'POST',headers:testerHeaders({'Content-Type':file.type||'image/jpeg','X-VillageLens-Capture-ID':captureId}),body:file});
        if (response.status===401) return location.href='/access'; const value=await response.json();
        if (!response.ok) throw new Error(value.error||'CAPTURE_FAILED');
        item.id=value.capture_id; item.image_url=value.retained?value.image_url:objectUrl;
        if (!item.result||!item.stage2) item.result=value;
        if (item.summary_kn) item.result.summary_kn=item.summary_kn;
        if (navigation===navigationGeneration&&gallery[galleryIndex]===item) {
          render(item.result);
          if (!value.retained) status.textContent+=' This test could not be saved.';
        }
        await startCloudReaders(item,file);
      } catch (_) {
        endTimer(item); $('quality-1').classList.add('failed');
        if (navigation===navigationGeneration) status.textContent='ಈ ಚಿತ್ರವನ್ನು ಓದಲು ಆಗಲಿಲ್ಲ. ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ.';
      }
      finally { input.value=''; if (image.src!==objectUrl) URL.revokeObjectURL(objectUrl); }
    }
    $('mode-word').onclick=()=>setMode('word'); $('mode-sentence').onclick=()=>setMode('sentence');
    $('mode-meaning').onclick=()=>setMode('meaning'); $('camera').onclick=()=>input.click();
    $('play-words').onclick=()=>result&&play(result.words||[]); $('play-sentences').onclick=()=>result&&play(result.lines||[]);
    $('play-meanings').onclick=explainMeaning; $('play-whole').onclick=explainMeaning; $('stop').onclick=stop;
    $('previous').onclick=()=>showGallery(galleryIndex-1); $('next').onclick=()=>showGallery(galleryIndex+1);
    input.onchange=()=>useCapture(input.files&&input.files[0]);
    document.addEventListener('pointerdown',()=>{ ensureAudioContext(); },{passive:true});
    stage.addEventListener('pointerdown',event=>{ pointerStart={x:event.clientX,y:event.clientY}; suppressTap=false; });
    stage.addEventListener('pointerup',event=>{
      if (!pointerStart) return; const dx=event.clientX-pointerStart.x,dy=event.clientY-pointerStart.y; pointerStart=null;
      if (Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)) { suppressTap=true; showGallery(galleryIndex+(dx<0?1:-1)); setTimeout(()=>suppressTap=false,250); }
    });
    loadGallery();
  </script>
</body>
</html>
